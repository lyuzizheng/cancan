[package]
name = "cancan-desktop-feasibility"
version = "0.0.0"
description = "Disposable CanCan desktop and storage feasibility evidence"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
keyring = "4.1.4"
rand = "0.8.5"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = { version = "2.11.5", features = [] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
