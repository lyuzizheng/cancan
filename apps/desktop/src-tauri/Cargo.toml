[package]
name = "cancan-desktop"
version = "0.0.0"
description = "CanCan local-first desktop application"
edition = "2024"
publish = false

[lib]
name = "cancan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chacha20poly1305 = { version = "=0.10.1", features = ["std"] }
hkdf = "=0.12.4"
rand = "=0.8.5"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"
