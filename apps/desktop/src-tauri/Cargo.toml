[package]
name = "cancan-desktop"
version = "0.0.0"
description = "CanCan local-first desktop application"
edition = "2024"
publish = false

[lib]
name = "cancan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.10.1", features = ["std"] }
csv = "=1.4.0"
hkdf = "=0.12.4"
keyring-core = "=1.0.0"
libc = "=0.2.189"
notify = "=8.2.0"
png = "=0.18.1"
rand = "=0.8.5"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-shell = "=2.3.5"
tokio = { version = "=1.52.3", features = ["time"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", features = ["keychain"] }
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "block2"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGImage"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSNotification", "NSOperation", "NSString", "NSURL", "NSValue", "block2"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["PDFDocument", "PDFPage"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation"] }
security-framework = "=3.7.0"

[dev-dependencies]
tempfile = "=3.27.0"
