name: Bug report
description: Report a reproducible problem in the CanCan desktop app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. This form is for **reproducible problems** — usage questions belong in [Discussions → Questions](https://github.com/lyuzizheng/cancan/discussions), and security issues must **never** be filed publicly (see [SECURITY.md](../SECURITY.md)).

        **Never include real financial data, account numbers, statement files, or secrets in this report.** Redact or use synthetic examples.
  - type: input
    id: version
    attributes:
      label: CanCan version
      description: The version shown in the app (for example 0.1.0-preview). If you built from source, give the commit hash.
      placeholder: 0.1.0-preview
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      description: For example "macOS 15.5 on Apple Silicon (arm64)" or "macOS 14 on Intel (x86_64)".
      placeholder: macOS 15 on Apple Silicon (arm64)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: The smallest sequence of steps that reliably triggers the problem.
      placeholder: |
        1. Open ...
        2. Import ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages verbatim where possible.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics (optional)
      description: Relevant log excerpts or screenshots. Operational logs are local-only and redacted; check once more that nothing financial or secret is visible before attaching.
    validations:
      required: false
