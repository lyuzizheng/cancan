name: Bug report
description: Report a reproducible problem in the CanCan desktop app
title: "fix(<area>): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. This form is for **reproducible problems** — usage questions belong in [Discussions → Questions](https://github.com/lyuzizheng/cancan/discussions), and security issues must **never** be filed publicly (see [SECURITY.md](https://github.com/lyuzizheng/cancan/blob/main/SECURITY.md)).

        **Never include real financial data, account numbers, statement files, or secrets in this report.** Redact or use synthetic examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing. Include the CanCan version (for example 0.1.0-preview, or the commit hash) and OS/architecture, then the smallest reproduction steps.
      placeholder: |
        CanCan version: 0.1.0-preview on macOS 15.5 (arm64)

        1. Open ...
        2. Import ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen. Include error messages verbatim where possible.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and how badly? Feeds the priority rubric (a broken core flow is priority:p1, a data-loss or privacy bug is priority:p0).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: What the fix should touch (packages/apps, spec sections), and what is explicitly out of scope.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How to prove the fix (regression test, manual steps, gate names).
    validations:
      required: false
  - type: textarea
    id: spec_change
    attributes:
      label: Spec change (optional)
      description: If the bug reveals a wrong behavior contract, which docs/specs/ section should change — otherwise leave as "No spec change". The fix PR lands the spec change together with the code.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics (optional)
      description: Relevant log excerpts or screenshots. Operational logs are local-only and redacted; check once more that nothing financial or secret is visible before attaching.
    validations:
      required: false
