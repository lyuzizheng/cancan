name: Application native

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - apps/desktop/src-tauri/**
      - apps/desktop/src/generated/presentation-types.ts
      - apps/desktop/package.json
      - packages/ai/**
      - packages/parsers/**
      - packages/db/migrations/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .node-version
      - rust-toolchain.toml
      - scripts/dev-toolchain.env
      - .github/workflows/application-native.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-application-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install package manager
        run: |
          source scripts/dev-toolchain.env
          npm install --global "corepack@$COREPACK_VERSION"
          corepack enable
          corepack install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Prepare Rust and harness dependencies
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
          brew install ripgrep
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository preflight
        run: .agents/scripts/agent-preflight.sh
      - name: Run native application gate
        run: pnpm verify:native
