name: Docs harness

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - .agents/**
      - .codex/**
      - scripts/**
      - .node-version
      - rust-toolchain.toml
      - spikes/desktop-feasibility/package.json
      - docs/**
      - .github/workflows/docs-harness.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - README.md
      - .agents/**
      - .codex/**
      - scripts/**
      - .node-version
      - rust-toolchain.toml
      - spikes/desktop-feasibility/package.json
      - docs/**
      - .github/workflows/docs-harness.yml

permissions:
  contents: read

jobs:
  deterministic-docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install harness dependency
        run: sudo apt-get update && sudo apt-get install --yes libdigest-sha-perl ripgrep ruby
      - name: Run preflight
        run: .agents/scripts/agent-preflight.sh
      - name: Test the harness
        run: .agents/scripts/harness-self-test.sh
