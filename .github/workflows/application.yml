name: Application

on:
  pull_request:
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .node-version
      - rust-toolchain.toml
      - scripts/dev-toolchain.env
      - .github/workflows/application.yml
  push:
    branches:
      - main
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .node-version
      - rust-toolchain.toml
      - scripts/dev-toolchain.env
      - .github/workflows/application.yml

permissions:
  contents: read

jobs:
  application-gate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install package manager
        run: |
          source scripts/dev-toolchain.env
          npm install --global "corepack@$COREPACK_VERSION"
          corepack enable
          corepack install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Prepare Rust and harness dependencies
        run: |
          rustup show active-toolchain
          rustc --version
          cargo clippy --version
          brew install ripgrep
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository preflight
        run: .agents/scripts/agent-preflight.sh
      - name: Run application gate
        run: pnpm verify
