name: Application fast

on:
  pull_request:
    paths:
      - apps/desktop/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .node-version
      - rust-toolchain.toml
      - scripts/dev-toolchain.env
      - scripts/check-source-file-size.mjs
      - scripts/check-tailwind-discipline.mjs
      - .github/workflows/application.yml
      - .github/workflows/application-native.yml
  push:
    branches:
      - main
    paths:
      - apps/desktop/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .node-version
      - rust-toolchain.toml
      - scripts/dev-toolchain.env
      - scripts/check-source-file-size.mjs
      - scripts/check-tailwind-discipline.mjs
      - .github/workflows/application.yml
      - .github/workflows/application-native.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-application-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install package manager
        run: |
          source scripts/dev-toolchain.env
          npm install --global "corepack@$COREPACK_VERSION"
          corepack enable
          corepack install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Install harness dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdigest-sha-perl ripgrep ruby
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository preflight
        run: .agents/scripts/agent-preflight.sh
      - name: Run fast application gate
        run: pnpm verify:fast
