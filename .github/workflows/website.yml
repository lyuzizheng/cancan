name: Website

on:
  pull_request:
    paths:
      - apps/website/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - scripts/dev-toolchain.env
      - .github/workflows/website.yml
  push:
    branches:
      - main
    paths:
      - apps/website/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - scripts/dev-toolchain.env
      - .github/workflows/website.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install package manager
        run: |
          source scripts/dev-toolchain.env
          npm install --global "corepack@$COREPACK_VERSION"
          corepack enable
          corepack install --global "pnpm@$PNPM_VERSION"
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the website
        run: pnpm --filter @cancan/website typecheck
      - name: Run static website gate
        run: pnpm check:website
